<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Garage Sale Simulator</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- 3D CANVAS -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD OVERLAY -->
  <div id="hud">
    <div id="hud-top">
      <div id="hud-cash">💰 <span id="cash-display">$0.00</span></div>
      <div id="hud-house">🏠 Starter House</div>
      <div id="hud-inv">📦 <span id="inv-display">0/20</span></div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair">+</div>

    <!-- Interact prompt -->
    <div id="interact-prompt" class="hidden">
      <span id="interact-icon">📦</span>
      <span id="interact-text">Tap to pick up</span>
    </div>

    <!-- Inventory bar (bottom) -->
    <div id="inv-bar">
      <div id="inv-slots"></div>
    </div>
  </div>

  <!-- MOBILE CONTROLS -->
  <div id="mobile-controls">
    <!-- Left joystick -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <!-- Interact button (right side) -->
    <div id="interact-btn" class="hidden">
      <span>PICK UP</span>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div id="loading-content">
      <div id="loading-title">🏷️ Garage Sale Sim</div>
      <div id="loading-sub">Loading your house...</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>
  </div>

  <!-- START SCREEN (shown after loading) -->
  <div id="start-screen" class="hidden">
    <div id="start-content">
      <div id="start-title">🏷️ Garage Sale Sim</div>
      <p>Search your house for items to sell!</p>
      <div id="start-controls">
        <div>📱 <strong>Mobile:</strong> Joystick to move, drag to look, tap PICK UP</div>
        <div>🖥️ <strong>Desktop:</strong> WASD to move, mouse to look, E to pick up</div>
      </div>
      <button id="start-btn">Enter House →</button>
    </div>
  </div>

  <script src="js/three.min.js"></script>
  <script type="module">
    // Load cannon-es as ES module and expose as global CANNON
    import * as CANNON from './js/cannon-es.js';
    window.CANNON = CANNON;

    // Now load all game scripts after CANNON is available
    const scripts = [
      'js/items.js',
      'js/world.js',
      'js/player.js',
      'js/objects.js',
      'js/ui.js',
      'js/main.js',
    ];
    for (const src of scripts) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }
  </script>
</body>
</html>
